<!DOCTYPE html>
<html>
    <form >
        <legend>Student Registration Form</legend>
        <label for="name">Full name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="Email">Email:</label>
        <input type="text" id="email" name="email" placeholder="Enter your email example@gmail.com" required>
        <br><br>
        <label for="password">password:</label>
        <input type="text" id="password" name="password" required>
        <br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age">
        <br><br>
        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>
        <label for="Course">Course</label>
        <select name="course" id="course">
            <option value="cs">Computer science</option>
            <option value="it">Information Technology</option>
            <option value="se">Software Engineering</option>
            <option value="bsw">Bachelor of social work</option>
        </select>
        <br><br>
        <p>Programming language known</p>
        <input type="checkbox" name="language" id="cpp" value="cpp">
        <label for="c++">C++</label>
        <input type="checkbox" name="language" id="java" value="java">
        <label for="java">Java</label>
        <input type="checkbox" name="language" id="python" value="python">
        <label for="python">Python</label>
        <input type="checkbox" name="language" id="c" value="c">
        <label for="c">C</label>
        <br><br>
        <button>Register</button>
        <button>Clear</button>




    </form>
